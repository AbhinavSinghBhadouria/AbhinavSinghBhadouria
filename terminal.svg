<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" height="100%">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a18"/>
      <stop offset="50%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#070d1e"/>
    </linearGradient>
    <linearGradient id="termBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .term-title { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; font-size: 13px; fill: #94a3b8; }
      .prompt { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 14px; font-weight: 700; fill: #38bdf8; }
      .cmd { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 14px; font-weight: 600; fill: #f8fafc; }
      .label { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; font-weight: 600; fill: #818cf8; }
      .val { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; fill: #e2e8f0; }
      .accent { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; font-weight: 700; fill: #34d399; }
      .muted { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 12px; fill: #64748b; }
      .bar-bg { fill: #1e293b; rx: 4px; }
      .bar-fill { rx: 4px; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      .cursor { animation: blink 1s infinite; fill: #38bdf8; }
    </style>
  </defs>

  <!-- Window Container -->
  <rect x="2" y="2" width="876" height="336" rx="12" fill="url(#termBg)" stroke="url(#termBorder)" stroke-width="2"/>

  <!-- Window Header Bar -->
  <path d="M 2 14 Q 2 2 14 2 L 866 2 Q 878 2 878 14 L 878 38 L 2 38 Z" fill="#0b1120"/>
  <line x1="2" y1="38" x2="878" y2="38" stroke="#1e293b" stroke-width="1"/>

  <!-- Window Control Buttons -->
  <circle cx="24" cy="20" r="6" fill="#ef4444"/>
  <circle cx="44" cy="20" r="6" fill="#f59e0b"/>
  <circle cx="64" cy="20" r="6" fill="#10b981"/>

  <!-- Terminal Window Title -->
  <text x="440" y="24" text-anchor="middle" class="term-title">abhinav@core-node: ~/system-diagnostics (zsh)</text>

  <!-- Active Status Tag -->
  <rect x="745" y="10" width="118" height="20" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <circle cx="757" cy="20" r="4" fill="#34d399" filter="url(#neonGlow)"/>
  <text x="768" y="24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#a7f3d0">DAEMON: ONLINE</text>

  <!-- Line 1: Command execution -->
  <text x="30" y="70" class="prompt">➜  system</text>
  <text x="110" y="70" class="cmd">neofetch --arch --profile abhinav</text>

  <!-- Left Column: ASCII Core / System Emblem -->
  <g transform="translate(30, 92)">
    <rect x="0" y="0" width="130" height="130" rx="8" fill="#0a1226" stroke="#1e293b" stroke-width="1"/>
    <text x="65" y="32" font-family="monospace" font-size="18" font-weight="900" text-anchor="middle" fill="#38bdf8">/\_/\</text>
    <text x="65" y="54" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle" fill="#818cf8">(  o.o )</text>
    <text x="65" y="74" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle" fill="#c084fc">&gt; ^ &lt;</text>
    <text x="65" y="100" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" text-anchor="middle" fill="#34d399">LATENCY: &lt;1ms</text>
    <text x="65" y="118" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle" fill="#94a3b8">DISTRIBUTED</text>
  </g>

  <!-- Middle/Right Column: Specs Output -->
  <g transform="translate(180, 85)">
    <!-- OS / Kernel -->
    <text x="0" y="18" class="label">OS:</text>
    <text x="90" y="18" class="val">Arch Linux x86_64 / macOS Kernel Darwin</text>

    <!-- Role -->
    <text x="0" y="42" class="label">ROLE:</text>
    <text x="90" y="42" class="val">Full-Stack Architect &amp; AI Systems Engineer</text>

    <!-- Core Stack -->
    <text x="0" y="66" class="label">STACK:</text>
    <text x="90" y="66" class="val">MERN • Next.js • Python • Docker • WebSockets • Redis</text>

    <!-- AI Pipeline -->
    <text x="0" y="90" class="label">AI/LLM:</text>
    <text x="90" y="90" class="val">Groq Acceleration • LLaMA 3 • Agentic Workflows • RAG</text>

    <!-- Metrics -->
    <text x="0" y="114" class="label">DSA METRIC:</text>
    <text x="90" y="114" class="accent">LeetCode 300+ Solved • CodeChef 3★ • Sub-millisecond Focus</text>

    <!-- Uptime -->
    <text x="0" y="138" class="label">UPTIME:</text>
    <text x="90" y="138" class="val">100% Passion • Continuous Integration &amp; Deployment</text>
  </g>

  <!-- Hardware / Performance Bars -->
  <g transform="translate(30, 246)">
    <!-- Bar 1: DSA / Problem Solving -->
    <text x="0" y="14" class="muted">ALGORITHMIC EFFICIENCY</text>
    <rect x="0" y="22" width="250" height="8" class="bar-bg"/>
    <rect x="0" y="22" width="235" height="8" class="bar-fill" fill="#38bdf8"/>
    <text x="258" y="30" font-family="monospace" font-size="11" font-weight="700" fill="#38bdf8">94%</text>

    <!-- Bar 2: Full Stack / WebSockets -->
    <text x="300" y="14" class="muted">CONCURRENCY &amp; REALTIME</text>
    <rect x="300" y="22" width="250" height="8" class="bar-bg"/>
    <rect x="300" y="22" width="240" height="8" class="bar-fill" fill="#818cf8"/>
    <text x="558" y="30" font-family="monospace" font-size="11" font-weight="700" fill="#818cf8">96%</text>

    <!-- Bar 3: AI Inference / RAG -->
    <text x="600" y="14" class="muted">LLM INFERENCE &amp; RAG</text>
    <rect x="600" y="22" width="210" height="8" class="bar-bg"/>
    <rect x="600" y="22" width="195" height="8" class="bar-fill" fill="#34d399"/>
    <text x="818" y="30" font-family="monospace" font-size="11" font-weight="700" fill="#34d399">93%</text>
  </g>

  <!-- Prompt Cursor at bottom -->
  <g transform="translate(30, 310)">
    <text x="0" y="14" class="prompt">abhinav@core:~$</text>
    <text x="130" y="14" class="cmd">deploy --production --scale=global</text>
    <rect x="422" y="3" width="9" height="14" class="cursor"/>
  </g>
</svg>
