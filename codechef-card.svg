<svg width="495" height="195" viewBox="0 0 495 195" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f55036;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff8c42;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffb300;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#f55036" flood-opacity="0.15"/>
    </filter>
    <clipPath id="rounded">
      <rect width="495" height="195" rx="15" ry="15"/>
    </clipPath>
    <style>
      @keyframes fadeSlide {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .stat { animation: fadeSlide 0.6s ease forwards; }
      .s1 { animation-delay: 0.1s; opacity: 0; }
      .s2 { animation-delay: 0.25s; opacity: 0; }
      .s3 { animation-delay: 0.4s; opacity: 0; }
      .s4 { animation-delay: 0.55s; opacity: 0; }
    </style>
  </defs>

  <!-- Background -->
  <g clip-path="url(#rounded)">
    <rect width="495" height="195" fill="url(#bg)" rx="15" ry="15"/>
    <!-- Subtle grid lines -->
    <line x1="0" y1="65" x2="495" y2="65" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    <line x1="0" y1="130" x2="495" y2="130" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    <!-- Left accent bar -->
    <rect width="4" height="195" fill="url(#accentGrad)" rx="2"/>
    <!-- Decorative circle -->
    <circle cx="450" cy="30" r="60" fill="#f55036" fill-opacity="0.04"/>
    <circle cx="60" cy="180" r="50" fill="#ff8c42" fill-opacity="0.04"/>
  </g>

  <!-- Border -->
  <rect width="495" height="195" rx="15" ry="15" fill="none" stroke="#f55036" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- CodeChef Icon area -->
  <text x="28" y="42" font-family="'Segoe UI', sans-serif" font-size="22">🍴</text>

  <!-- Title -->
  <text x="58" y="40" font-family="'Segoe UI', Helvetica, sans-serif" font-weight="700" font-size="18" fill="#ffffff" letter-spacing="0.5">CodeChef Stats</text>
  <text x="58" y="56" font-family="'Segoe UI', sans-serif" font-size="11" fill="#a0a0b0">op_finalboss_7 · Abhinav Singh Bhadouria</text>

  <!-- Divider -->
  <rect x="20" y="68" width="455" height="1.5" fill="url(#accentGrad)" opacity="0.4" rx="1"/>

  <!-- Rating (big centerpiece) -->
  <g class="stat s1">
    <text x="28" y="100" font-family="'Segoe UI', sans-serif" font-size="11" fill="#a0a0b0" letter-spacing="1">CURRENT RATING</text>
    <text x="28" y="130" font-family="'Segoe UI', Helvetica, sans-serif" font-weight="800" font-size="36" fill="#ffffff" filter="url(#glow)">1441</text>
    <!-- Star badge -->
    <rect x="28" y="137" width="48" height="18" rx="9" fill="url(#starGrad)" opacity="0.95"/>
    <text x="52" y="150" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#1a1a2e" text-anchor="middle">2 ★</text>
    <text x="82" y="150" font-family="'Segoe UI', sans-serif" font-size="11" fill="#a0a0b0">Div. 3</text>
  </g>

  <!-- Vertical separator -->
  <rect x="185" y="75" width="1" height="100" fill="#ffffff" fill-opacity="0.08" rx="1"/>

  <!-- Stats grid -->
  <!-- Problems Solved -->
  <g class="stat s2">
    <text x="205" y="95" font-family="'Segoe UI', sans-serif" font-size="10" fill="#a0a0b0" letter-spacing="0.8">PROBLEMS SOLVED</text>
    <text x="205" y="120" font-family="'Segoe UI', Helvetica, sans-serif" font-weight="700" font-size="28" fill="#f55036">121</text>
    <text x="205" y="137" font-family="'Segoe UI', sans-serif" font-size="10" fill="#606070">total accepted</text>
  </g>

  <!-- Contests -->
  <g class="stat s3">
    <text x="205" y="162" font-family="'Segoe UI', sans-serif" font-size="10" fill="#a0a0b0" letter-spacing="0.8">CONTESTS</text>
    <text x="260" y="162" font-family="'Segoe UI', Helvetica, sans-serif" font-weight="700" font-size="16" fill="#ff8c42">31</text>
    <text x="282" y="162" font-family="'Segoe UI', sans-serif" font-size="10" fill="#606070">participated</text>
  </g>

  <!-- Vertical separator 2 -->
  <rect x="340" y="75" width="1" height="100" fill="#ffffff" fill-opacity="0.08" rx="1"/>

  <!-- Rankings -->
  <g class="stat s4">
    <text x="360" y="95" font-family="'Segoe UI', sans-serif" font-size="10" fill="#a0a0b0" letter-spacing="0.8">GLOBAL RANK</text>
    <text x="360" y="118" font-family="'Segoe UI', Helvetica, sans-serif" font-weight="700" font-size="22" fill="#ffffff">#69,146</text>

    <text x="360" y="142" font-family="'Segoe UI', sans-serif" font-size="10" fill="#a0a0b0" letter-spacing="0.8">COUNTRY RANK</text>
    <text x="360" y="162" font-family="'Segoe UI', Helvetica, sans-serif" font-weight="700" font-size="18" fill="#ffffff">#65,126</text>
    <text x="360" y="177" font-family="'Segoe UI', sans-serif" font-size="10" fill="#606070">🇮🇳 India</text>
  </g>

  <!-- Bottom badge: highest rating -->
  <rect x="20" y="170" width="150" height="16" rx="8" fill="#f55036" fill-opacity="0.12"/>
  <text x="28" y="182" font-family="'Segoe UI', sans-serif" font-size="10" fill="#f55036">⬆ Highest Rating: 1506</text>
</svg>