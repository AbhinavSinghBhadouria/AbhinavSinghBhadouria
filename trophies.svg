<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 150" width="100%" height="100%">
  <defs>
    <!-- Card & Border Gradients -->
    <linearGradient id="trophyCardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#050a18" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .badge-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 800; }
      .badge-sub { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 10px; font-weight: 600; fill: #94a3b8; }
      .badge-rank { font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 700; letter-spacing: 0.5px; }
    </style>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="976" height="146" rx="12" fill="#030712" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Badge 1: Master Architect -->
  <g transform="translate(16, 15)">
    <rect width="148" height="120" rx="10" fill="url(#trophyCardBg)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="74" cy="38" r="22" fill="#0f172a" stroke="url(#cyanGrad)" stroke-width="2" filter="url(#badgeGlow)"/>
    <text x="74" y="44" font-size="18" text-anchor="middle">🏛️</text>
    <text x="74" y="78" text-anchor="middle" class="badge-title" fill="#e0f2fe">ARCHITECT</text>
    <text x="74" y="93" text-anchor="middle" class="badge-sub">Distributed Sys</text>
    <rect x="34" y="100" width="80" height="14" rx="7" fill="#0369a1" fill-opacity="0.3"/>
    <text x="74" y="110" text-anchor="middle" class="badge-rank" fill="#38bdf8">TIER S • CORE</text>
  </g>

  <!-- Badge 2: Sub-millisecond Execution -->
  <g transform="translate(176, 15)">
    <rect width="148" height="120" rx="10" fill="url(#trophyCardBg)" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="74" cy="38" r="22" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="2" filter="url(#badgeGlow)"/>
    <text x="74" y="44" font-size="18" text-anchor="middle">⚡</text>
    <text x="74" y="78" text-anchor="middle" class="badge-title" fill="#fef3c7">LOW LATENCY</text>
    <text x="74" y="93" text-anchor="middle" class="badge-sub">&lt; 1ms Realtime</text>
    <rect x="34" y="100" width="80" height="14" rx="7" fill="#b45309" fill-opacity="0.3"/>
    <text x="74" y="110" text-anchor="middle" class="badge-rank" fill="#fbbf24">SUB-MS SPEC</text>
  </g>

  <!-- Badge 3: AI Inference & RAG -->
  <g transform="translate(336, 15)">
    <rect width="148" height="120" rx="10" fill="url(#trophyCardBg)" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="74" cy="38" r="22" fill="#0f172a" stroke="url(#violetGrad)" stroke-width="2" filter="url(#badgeGlow)"/>
    <text x="74" y="44" font-size="18" text-anchor="middle">🧠</text>
    <text x="74" y="78" text-anchor="middle" class="badge-title" fill="#f3e8ff">AI ENGINE</text>
    <text x="74" y="93" text-anchor="middle" class="badge-sub">LLaMA 3 • Groq</text>
    <rect x="34" y="100" width="80" height="14" rx="7" fill="#6b21a8" fill-opacity="0.3"/>
    <text x="74" y="110" text-anchor="middle" class="badge-rank" fill="#c084fc">ACCELERATED</text>
  </g>

  <!-- Badge 4: DSA Problem Solver -->
  <g transform="translate(496, 15)">
    <rect width="148" height="120" rx="10" fill="url(#trophyCardBg)" stroke="#34d399" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="74" cy="38" r="22" fill="#0f172a" stroke="url(#emeraldGrad)" stroke-width="2" filter="url(#badgeGlow)"/>
    <text x="74" y="44" font-size="18" text-anchor="middle">🎯</text>
    <text x="74" y="78" text-anchor="middle" class="badge-title" fill="#d1fae5">DSA MASTERY</text>
    <text x="74" y="93" text-anchor="middle" class="badge-sub">LeetCode &amp; CodeChef</text>
    <rect x="34" y="100" width="80" height="14" rx="7" fill="#047857" fill-opacity="0.3"/>
    <text x="74" y="110" text-anchor="middle" class="badge-rank" fill="#34d399">300+ SOLVED</text>
  </g>

  <!-- Badge 5: Docker & Cloud -->
  <g transform="translate(656, 15)">
    <rect width="148" height="120" rx="10" fill="url(#trophyCardBg)" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="74" cy="38" r="22" fill="#0f172a" stroke="url(#indigoGrad)" stroke-width="2" filter="url(#badgeGlow)"/>
    <text x="74" y="44" font-size="18" text-anchor="middle">🐳</text>
    <text x="74" y="78" text-anchor="middle" class="badge-title" fill="#e0e7ff">CONTAINERS</text>
    <text x="74" y="93" text-anchor="middle" class="badge-sub">Docker • Microservices</text>
    <rect x="34" y="100" width="80" height="14" rx="7" fill="#4338ca" fill-opacity="0.3"/>
    <text x="74" y="110" text-anchor="middle" class="badge-rank" fill="#818cf8">CONTAINERIZED</text>
  </g>

  <!-- Badge 6: Full Stack MERN/Next -->
  <g transform="translate(816, 15)">
    <rect width="148" height="120" rx="10" fill="url(#trophyCardBg)" stroke="#fb923c" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="74" cy="38" r="22" fill="#0f172a" stroke="url(#amberGrad)" stroke-width="2" filter="url(#badgeGlow)"/>
    <text x="74" y="44" font-size="18" text-anchor="middle">🚀</text>
    <text x="74" y="78" text-anchor="middle" class="badge-title" fill="#ffedd5">FULL STACK</text>
    <text x="74" y="93" text-anchor="middle" class="badge-sub">MERN • Next.js • TS</text>
    <rect x="34" y="100" width="80" height="14" rx="7" fill="#c2410c" fill-opacity="0.3"/>
    <text x="74" y="110" text-anchor="middle" class="badge-rank" fill="#fb923c">PRODUCTION</text>
  </g>
</svg>
